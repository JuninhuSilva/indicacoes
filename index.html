<!doctype html>
<html lang="pt-PT">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEF1EC">

</head>
<body>
  <header class="topo">
    <button id="voltar" class="botao-voltar" type="button" aria-label="Voltar" hidden>
      <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="titulo">Painel</h1>
  </header>

  <main id="app" tabindex="-1"><p class="vazio-curto">A carregar…</p></main>

  <nav class="navegacao" aria-label="Navegação principal">
    <a href="#/" data-tab="painel">
      <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Painel

    <a href="#/nova" class="nav-nova" data-tab="nova">
      <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Nova
    </a>
    <a href="#/lista" data-tab="lista">
      <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      Lista
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="vazio-curto">Esta app precisa de JavaScript ativo.</p></noscript>
  <script type="module" src="js/app.js"></script>

</html>
